backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "images"

collections:
  - name: "settings"
    label: "Website Content"
    description: "Manage all website content including team, services, portfolio, and stats"
    files:
      - name: "content"
        label: "All Content"
        file: "data/content.json"
        format: "json"
        fields:
          - name: stats
            label: Company Statistics
            widget: object
            fields:
              - {label: "Clients Worldwide", name: clients, widget: string}
              - {label: "Projects Delivered", name: projects, widget: string}
              - {label: "Years Experience", name: experience, widget: string}
              - {label: "Support Hours (e.g. 24)", name: support, widget: string}

          - name: team
            label: Team Members
            widget: list
            summary: "{{fields.name}} - {{fields.role}}"
            fields:
              - {label: Name, name: name, widget: string}
              - {label: Role, name: role, widget: string}
              - {label: Photo, name: image, widget: image}
              - {label: Description, name: description, widget: text}

          - name: services
            label: Services
            widget: list
            summary: "{{fields.title}}"
            fields:
              - {label: "ID (e.g. ai, web, mobile)", name: id, widget: string, hint: "Used in URLs - lowercase, no spaces"}
              - {label: Title, name: title, widget: string}
              - {label: "Service Image", name: icon, widget: image}
              - {label: Description, name: description, widget: text}
              - name: bullets
                label: Key Features
                widget: list
                hint: "List of feature bullet points"

          - name: portfolio
            label: Portfolio Items
            widget: list
            summary: "{{fields.title}} ({{fields.category}})"
            fields:
              - {label: Title, name: title, widget: string}
              - {label: "Category", name: category, widget: select, options: ["ai", "web", "mobile", "seo"]}
              - {label: Image, name: image, widget: image}
              - {label: Client, name: client, widget: string}
              - {label: Description, name: description, widget: text}
